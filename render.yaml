services:
  - type: web
    name: meesho-automation-studio
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_STRING_SESSION
        sync: false
      - key: TELEGRAM_API_ID
        value: "35009041"
      - key: TELEGRAM_API_HASH
        value: "c0cc7d04faca251fbb0f8739927779b1"
      - key: FAMGATEWAY_API_KEY
        sync: false
      - key: INDIAN_PROXY
        sync: false
