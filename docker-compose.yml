version: '3.8'

services:
  meesho-studio:
    build: .
    container_name: meesho_automation_studio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=meesho-production-secret-key-change-in-prod
      - DB_FILE=/app/data/meesho_studio.db
    volumes:
      - ./data:/app/data
      - ./userbot.session.txt:/app/userbot.session.txt

